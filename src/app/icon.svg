<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="syslab">
  <!-- The syslab mark: a request packet travelling a wire. Colors are inlined
       because an SVG favicon is loaded out of document context and cannot read
       the theme's CSS custom properties. Arctic frost = #88c0d0 / Polar Night. -->
  <rect width="32" height="32" rx="7" fill="#2E3440"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="6.25" fill="none" stroke="#88C0D0" stroke-opacity="0.32" stroke-width="1.5"/>
  <path d="M6 16h20" stroke="#88C0D0" stroke-opacity="0.36" stroke-width="2" stroke-linecap="round"/>
  <circle cx="9.5" cy="16" r="1.75" fill="#88C0D0" fill-opacity="0.55"/>
  <circle cx="20.5" cy="16" r="5" fill="#88C0D0"/>
</svg>
